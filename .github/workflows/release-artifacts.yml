name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish artifacts for (example: romm-cli-v0.40.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      component: ${{ steps.resolve.outputs.component }}
      crate: ${{ steps.resolve.outputs.crate }}
      publish_binaries: ${{ steps.resolve.outputs.publish_binaries }}
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "${tag}" ]; then
            echo "Unable to resolve release tag."
            exit 1
          fi

          component=""
          crate=""
          publish_binaries="false"

          case "${tag}" in
            romm-api-v*)
              component="romm-api"
              crate="romm-api"
              ;;
            romm-cli-v*)
              component="romm-cli"
              crate="romm-cli"
              publish_binaries="true"
              ;;
            romm-tui-v*)
              component="romm-tui"
              crate="romm-tui"
              publish_binaries="true"
              ;;
            *)
              echo "Unrecognized release tag format: ${tag}"
              exit 1
              ;;
          esac

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "component=${component}" >> "${GITHUB_OUTPUT}"
          echo "crate=${crate}" >> "${GITHUB_OUTPUT}"
          echo "publish_binaries=${publish_binaries}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.publish_binaries == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_key: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_key: linux-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_key: windows-x86_64
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_key: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_key: macos-aarch64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      RELEASE_COMPONENT: ${{ needs.resolve-tag.outputs.component }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-${{ env.RELEASE_COMPONENT }}

      - name: Install cross-compiler (Linux aarch64)
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p "${RELEASE_COMPONENT}" --bin "${RELEASE_COMPONENT}"

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p artifact
          TGT="target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$TGT/${RELEASE_COMPONENT}.exe" artifact/
          else
            cp "$TGT/${RELEASE_COMPONENT}" artifact/
          fi

      - name: Fix permissions (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: chmod +x "artifact/${RELEASE_COMPONENT}"

      - name: Create archive (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          artifact_name="${RELEASE_COMPONENT}-${{ matrix.asset_key }}.${{ matrix.archive }}"
          cd artifact && tar czvf "../${artifact_name}" * && cd ..
          echo "ARTIFACT_NAME=${artifact_name}" >> "${GITHUB_ENV}"

      - name: Create archive (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $artifactName = "$env:RELEASE_COMPONENT-${{ matrix.asset_key }}.${{ matrix.archive }}"
          Compress-Archive -Path artifact\* -DestinationPath $artifactName
          echo "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_COMPONENT }}-${{ matrix.asset_key }}
          path: ${{ env.ARTIFACT_NAME }}

  upload-assets:
    needs: [resolve-tag, build]
    if: needs.resolve-tag.outputs.publish_binaries == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*/* release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    needs: [resolve-tag, build]
    if: always() && needs.resolve-tag.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify crates.io package
        run: cargo publish -p ${{ needs.resolve-tag.outputs.crate }} --dry-run
      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ needs.resolve-tag.outputs.crate }}
        run: |
          set +e
          output="$(cargo publish -p "${CRATE}" 2>&1)"
          status=$?
          echo "${output}"
          if [ "${status}" -ne 0 ]; then
            if echo "${output}" | grep -q "already exists on crates.io index"; then
              echo "::notice::${CRATE} version already published; treating as success (idempotent re-run)."
              exit 0
            fi
            exit "${status}"
          fi
